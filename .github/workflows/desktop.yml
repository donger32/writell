# Builds the Windows installer on GitHub's Windows machines and publishes it on
# the Releases page. Runs when a version tag like v0.10.0 is pushed
# (or by hand from the Actions tab → "Build Windows app" → Run workflow).
name: Build Windows app
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write   # to create the release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: 'src-tauri -> target' }
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Writell __VERSION__
          releaseBody: |
            Download **Writell___VERSION___x64-setup.exe** below and run it. Installing over an older version keeps your projects.
            If Windows says "Windows protected your PC", click More info → Run anyway.
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
