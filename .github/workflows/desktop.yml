# Builds the Windows installer on GitHub's Windows machines and publishes it on
# the Releases page as "Writell <version>". Runs whenever the version number in
# package.json changes on main (or by hand: Actions tab → "Build Windows app" → Run workflow).
# A version that already has a release is skipped.
name: Build Windows app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['package.json']

permissions:
  contents: write   # to create the release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip if this version is already released
        id: check
        shell: bash
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "v$v already released"; fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        if: steps.check.outputs.skip != 'true'
      - uses: swatinem/rust-cache@v2
        if: steps.check.outputs.skip != 'true'
        with: { workspaces: 'src-tauri -> target' }
      - run: npm ci
        if: steps.check.outputs.skip != 'true'
      - uses: tauri-apps/tauri-action@v0
        if: steps.check.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # signs the update so the app only installs updates made by you
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: v__VERSION__
          releaseName: Writell __VERSION__
          releaseBody: |
            Already have Writell 0.11 or newer on your PC? It will offer this update by itself.
            Otherwise download **Writell___VERSION___x64-setup.exe** below and run it. Installing over an older version keeps your projects.
            If Windows says "Windows protected your PC", click More info → Run anyway.
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
